{% extends "base.html" %}{% block title %}Group settings · {{ group.name }}{% endblock %}{% block content %}<p><a href="/groups/{{ group.id }}">← {{ group.name }}</a></p><section class="narrow"><h1>Group settings</h1>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post" class="stack"><label>Name<input name="name" value="{{ group.name }}" required maxlength="100"></label><label>Description<textarea name="description" rows="3" maxlength="500">{{ group.description }}</textarea></label><label>Group interests <span class="muted">(comma separated)</span><input name="hobbies" value="{{ group.hobbies }}"></label><label>Who can join<select name="visibility"><option value="public" {% if not group.is_private %}selected{% endif %}>Public — anyone with the link</option><option value="private" {% if group.is_private %}selected{% endif %}>Private — invite link only</option></select></label><label>Member limit <span class="muted">(optional)</span><input name="member_limit" type="number" min="2" value="{{ group.member_limit or '' }}" placeholder="No limit"></label><button>Save settings</button></form></section>{% endblock %}
