<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}The Third Space{% endblock %}</title>
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">The Third Space</a>
    {% if user %}<form action="/logout" method="post">{{ csrf_input(request) }}<span>{{ user.display_name }}</span> <button class="link-button">Sign out</button></form>{% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer><a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></footer>
  {% block scripts %}{% endblock %}
</body>
</html>
