{% extends "base.html" %}{% block title %}Create account{% endblock %}{% block content %}<section class="narrow"><h1>Create an account</h1>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post" class="stack"><label>Your name<input name="display_name" required maxlength="80" autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required minlength="10" autocomplete="new-password"></label><button>Create account</button></form><p><a href="/login">Already have an account?</a></p></section>{% endblock %}
