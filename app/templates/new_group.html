{% extends "base.html" %}

{% block title %}Create a group
{% endblock %}
{% block content %}
  <section class="narrow">
    <p class="eyebrow">Start with your people</p>
    <h1>Create a group</h1>
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/groups" class="stack">
      {{ csrf_input(request) }}
      {% include "group_fields.html" %}
      <button>Create group</button>
    </form>
  </section>
{% endblock %}
