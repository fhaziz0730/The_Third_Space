{% extends "base.html" %}{% block title %}Create a group{% endblock %}{% block content %}<section class="narrow"><p class="eyebrow">Start with your people</p><h1>Create a group</h1><form method="post" action="/groups" class="stack"><label>Group name<input name="name" required maxlength="100"></label><label>What brings you together?<textarea name="description" maxlength="500" rows="3"></textarea></label><label>Group interests <span class="muted">(comma separated)</span><input name="hobbies" placeholder="hiking, board games, coffee"></label><label>Who can join<select name="visibility"><option value="public">Public — anyone with the link</option><option value="private">Private — invite link only</option></select></label><label>Member limit <span class="muted">(optional)</span><input name="member_limit" type="number" min="2" placeholder="No limit"></label><button>Create group</button></form></section>{% endblock %}
