name: Encrypted database backup
on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * *"

permissions:
  contents: read

jobs:
  backup:
    if: vars.ENABLE_DB_BACKUPS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: postgres:17-bookworm
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Install encryption and Python tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv gnupg
          python3 -m venv /tmp/backup-venv
          /tmp/backup-venv/bin/pip install 'sqlalchemy>=2,<3'
      - name: Create encrypted dump
        run: /tmp/backup-venv/bin/python scripts/backup_database.py
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-database-${{ github.run_id }}
          path: backups/*.dump.gpg
          if-no-files-found: error
          retention-days: 7
