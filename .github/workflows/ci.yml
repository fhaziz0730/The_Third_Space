name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and verify migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: third_space
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: third_space_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U third_space -d third_space_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: development
      USE_MOCK_DATA: "false"
      LOCATION_SEARCH_PROVIDER: local
      PLACES_PROVIDER: local
      DATABASE_URL: postgresql+psycopg://third_space:ci-only-password@localhost:5432/third_space_test
      TEST_POSTGRES_URL: postgresql+psycopg://third_space:ci-only-password@localhost:5432/third_space_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests
      - run: node tests/location_picker.test.cjs
      - run: python -m app.migrate
      - run: python -m app.migrate
      - run: python -m alembic check
      - name: Verify container builds
        run: docker build -t third-space:ci .
